name: Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# CIはGitHub上でのビルドを前提とし、QuickJSをNDKでクロスビルドして同梱する
# 仕様: spec 9章 (arm64-v8aのみ, PIE, libqjsexec.so, nativeLibraryDir)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NDK_VERSION: "27.0.12077973"
      QUICKJS_REF: "master"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Azul Zulu, spec gradle-daemon-jvm.properties)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk-version: 27.0.12077973
          cmake-version: 3.22.1

      - name: Verify SDK and NDK
        run: |
          set -eux
          ls -la "$ANDROID_HOME/licenses/" 2>&1 | head -n 20 || true
          ls -la "$ANDROID_SDK_ROOT/licenses/" 2>&1 | head -n 20 || true
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36|ndk;" | head -n 20 || true
          # Always ensure licenses and platforms are installed (setup-android may miss licenses)
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1); fi
          echo "Using sdkmanager: $SDKMANAGER"
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
          # Ensure platforms and build-tools are installed (even if NDK exists, licenses may be missing)
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" --sdk_root="$ANDROID_HOME" --verbose || \
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" --sdk_root="$ANDROID_HOME" || true
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
          # Fallback for NDK if not found
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ] && [ ! -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ]; then
            echo "NDK not found, installing via sdkmanager..."
            yes | "$SDKMANAGER" --install "ndk;27.0.12077973" --sdk_root="$ANDROID_HOME" --verbose || \
            yes | "$SDKMANAGER" --install "ndk;27.0.12077973" --sdk_root="$ANDROID_HOME" || true
            yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
          fi
          ls -lh "$ANDROID_HOME/ndk/27.0.12077973/" 2>&1 | head -n 20 || ls -lh "$ANDROID_SDK_ROOT/ndk/27.0.12077973/" 2>&1 | head -n 20 || true
          if [ -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
            echo "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          elif [ -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          fi
          aarch64-linux-android24-clang --version || "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version || "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version

      - name: Verify Python for Chaquopy
        run: |
          python3 --version
          pip --version || pip3 --version
          python3 -c "import sys; print(sys.executable, sys.version)"

      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: /tmp/quickjs
          key: quickjs-${{ env.QUICKJS_REF }}-${{ env.NDK_VERSION }}
          restore-keys: |
            quickjs-

      - name: Build QuickJS (arm64-v8a PIE) — bellard/quickjs cross (host-qjsc)
        run: |
          set -eux
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          if [ ! -d "$TOOLCHAIN" ]; then TOOLCHAIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"; fi
          ls -la "$TOOLCHAIN/bin/" | grep -E "clang|llvm-ar" | head -n 20
          test -d /tmp/quickjs || git clone https://github.com/bellard/quickjs.git /tmp/quickjs
          cd /tmp/quickjs
          if [ "${QUICKJS_REF}" != "master" ]; then git fetch --depth 1 origin "${QUICKJS_REF}" && git checkout FETCH_HEAD; fi
          make clean || true; rm -rf .obj || true
          export CC="$TOOLCHAIN/bin/clang --target=aarch64-linux-android24"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          echo "CC=$CC"; echo "AR=$AR"
          make -j$(nproc) CROSS_PREFIX=host- CC="$CC" AR="$AR" STRIP="$STRIP" RANLIB="$RANLIB" LIBS="-lm" qjs
          ls -lh qjs; file qjs
          file qjs | grep -qi "aarch64" || (echo "Not aarch64" && file qjs && exit 1)
          "$TOOLCHAIN/bin/llvm-readelf" -h qjs | grep -E "Class|Machine|OS/ABI" || true
          mkdir -p "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a"
          cp -v qjs "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libqjsexec.so"
          chmod 755 "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libqjsexec.so"
          ls -lh "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/"
          file "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libqjsexec.so"

      - name: (Optional) Build FFmpeg arm64-v8a
        if: false
        run: |
          echo "FFmpeg build is heavy (30m+) — enable when needed per spec 10章"
          echo "See ytdlpAndroid/src/main/jniLibs/arm64-v8a/README.md"

      - name: Assemble Debug (verifies jniLibs extraction)
        run: |
          set -eux
          # Ensure licenses are accepted right before assemble (Gradle checks licenses at configuration)
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1); fi
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ "$ANDROID_SDK_ROOT" != "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/licenses" || true
            yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_SDK_ROOT" || true
          fi
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug --stacktrace
          unzip -l androidApp/build/outputs/apk/debug/*.apk | grep -E "libqjsexec|lib/arm64" || echo "::warning::libqjsexec not in APK (check packaging.jniLibs.useLegacyPackaging)"

      - name: Run JVM tests (core/composeApp)
        run: ./gradlew :core:jvmTest :core:jvmJar :composeApp:jvmJar --continue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-arm64
          path: ytdlpAndroid/src/main/jniLibs/arm64-v8a/libqjsexec.so
          if-no-files-found: error
