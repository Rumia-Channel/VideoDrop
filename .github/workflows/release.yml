name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.08.30) — 日付ベース"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.0.12077973"
      QUICKJS_REF: "master"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag (date-based if manual)
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk-version: 27.0.12077973
          cmake-version: 3.22.1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Verify SDK and NDK
          set -eux
          ls -la "$ANDROID_HOME/licenses/" 2>&1 | head -n 20 || true
          ls -la "$ANDROID_SDK_ROOT/licenses/" 2>&1 | head -n 20 || true
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36|ndk;" | head -n 20 || true
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ] && [ ! -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ]; then
            echo "NDK not found, installing via sdkmanager..."
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
            if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1); fi
            mkdir -p "$ANDROID_HOME/licenses" || true
            yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
            yes | "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0" "platform-tools" --sdk_root="$ANDROID_HOME" --verbose || \
            yes | "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0" "platform-tools" --sdk_root="$ANDROID_HOME"
            yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
          fi
          ls -lh "$ANDROID_HOME/ndk/27.0.12077973/" 2>&1 | head -n 20 || ls -lh "$ANDROID_SDK_ROOT/ndk/27.0.12077973/" 2>&1 | head -n 20 || true
          if [ -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
            echo "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          elif [ -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          fi
          aarch64-linux-android24-clang --version || "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version || "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version
      - name: Build QuickJS arm64-v8a
        run: |
          set -eux
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          if [ ! -d "$TOOLCHAIN" ]; then TOOLCHAIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"; fi
          ls -la "$TOOLCHAIN/bin/" | grep -E "aarch64|clang" | head -n 20
          test -d /tmp/quickjs || git clone https://github.com/bellard/quickjs.git /tmp/quickjs
          cd /tmp/quickjs
          make clean || true; rm -rf .obj || true
          export CC="$TOOLCHAIN/bin/clang --target=aarch64-linux-android24"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          make -j$(nproc) CROSS_PREFIX=host- CC="$CC" AR="$AR" STRIP="$STRIP" RANLIB="$RANLIB" LIBS="-lm" qjs
          ls -lh qjs; file qjs
          file qjs | grep -qi "aarch64" || (echo "Not aarch64" && file qjs && exit 1)
          mkdir -p "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a"
          cp -v qjs "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libqjsexec.so"
          chmod 755 "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libqjsexec.so"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: /tmp/ffmpeg
          key: ffmpeg-${{ env.NDK_VERSION }}-arm64-v8a-static
          restore-keys: |
            ffmpeg-

      - name: Build FFmpeg arm64-v8a (full GPL static PIE)
        run: |
          set -eux
          sudo apt-get update -q && sudo apt-get install -y -q yasm nasm pkg-config
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          if [ ! -d "$TOOLCHAIN" ]; then TOOLCHAIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"; fi
          CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          if [ ! -x "$CC" ]; then CC=$(find "$TOOLCHAIN/bin" -name "aarch64-linux-android24-clang" -type f | head -n1); fi

          if [ ! -d /tmp/ffmpeg/.git ]; then
            git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          fi
          cd /tmp/ffmpeg

          ./configure \
            --enable-cross-compile \
            --target-os=android --arch=aarch64 --cpu=armv8-a \
            --cc="$CC" --ld="$CC" \
            --ar="$TOOLCHAIN/bin/llvm-ar" \
            --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
            --nm="$TOOLCHAIN/bin/llvm-nm" \
            --strip="$TOOLCHAIN/bin/llvm-strip" \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --enable-small --disable-doc --disable-debug \
            --prefix=/tmp/ffmpeg/install
          make -j$(nproc)
          make install

          mkdir -p "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a"
          cp -v /tmp/ffmpeg/install/bin/ffmpeg "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libffmpegexec.so"
          cp -v /tmp/ffmpeg/install/bin/ffprobe "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libffprobeexec.so"
          chmod 755 "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libffmpegexec.so" "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libffprobeexec.so"
          ls -lh "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/"
          file "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libffmpegexec.so" "${GITHUB_WORKSPACE}/ytdlpAndroid/src/main/jniLibs/arm64-v8a/libffprobeexec.so"

      - name: Assemble Release APK (date version)
        run: |
          set -eux
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1); fi
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace
          ls -lh androidApp/build/outputs/apk/release/
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" || true
          ./gradlew :androidApp:assembleDebug
      - name: Rename APK with tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk "VideoDrop-${TAG}.apk" || cp androidApp/build/outputs/apk/release/*.apk "VideoDrop-${TAG}.apk" || true
          ls -lh VideoDrop-*.apk || ls -lh androidApp/build/outputs/apk/release/
          APK=$(ls VideoDrop-*.apk 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then APK=$(ls androidApp/build/outputs/apk/release/*.apk | head -n1); cp "$APK" "VideoDrop-${TAG}.apk"; fi
          echo "apk=VideoDrop-${TAG}.apk" >> $GITHUB_OUTPUT
        id: apk

      - name: Create GitHub Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.apk }}
            androidApp/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.tag.outputs.tag }}
          path: |
            VideoDrop-*.apk
            androidApp/build/outputs/apk/release/*.apk
